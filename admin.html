<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard | Ennie Garden Estate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
  <div class="logo">Ennie Garden Estate - Admin</div>
  <button class="nav-toggle">☰</button>
  <nav>
    <a href="index.html">Website</a>
    <a href="admin.html" class="active">Dashboard</a>
    <a href="#" onclick="logout(); return false;">Logout</a>
  </nav>
</header>

<section class="admin-container">
  <div class="admin-header">
    <h1>Booking Inquiries Dashboard</h1>
    <div class="admin-controls">
      <button class="btn-secondary" onclick="refreshData()">🔄 Refresh</button>
      <button class="btn-secondary" onclick="exportCSV()">📥 Export CSV</button>
    </div>
  </div>

  <div id="errorMessage" class="error-message" style="display:none;"></div>

  <div class="stats">
    <div class="stat-card">
      <h3>Total Inquiries</h3>
      <div class="number" id="totalLeads">0</div>
    </div>
    <div class="stat-card">
      <h3>This Month</h3>
      <div class="number" id="monthLeads">0</div>
    </div>
    <div class="stat-card">
      <h3>Most Popular Unit</h3>
      <div class="number" id="popularUnit" style="font-size:16px;">-</div>
    </div>
  </div>

  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="Search by name or email..." onkeyup="filterTable()">
    <select id="unitFilter" onchange="filterTable()">
      <option value="">All Units</option>
      <option value="5 Bedroom Fully Detached Duplex (Premium Unit)">5 Bedroom Fully Detached Duplex (Premium Unit)</option>
      <option value="5 Bedroom Fully Detached Duplex (Standard Units)">5 Bedroom Fully Detached Duplex (Standard Units)</option>
    </select>
  </div>


  <section style="margin-top:40px;">
    <div class="admin-header">
      <h2>Units Availability</h2>
    </div>
    <div id="featured-rooms" class="room-grid"></div>
  </section>

  <div class="table-container">
    <div id="loadingMessage" class="loading">Loading inquiries...</div>

    <table id="leadsTable" style="display:none;">
      <thead>
        <tr>
          <th>Date</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Unit</th>
          <th>Preferred Date</th>
          <th>Preferred Time</th>
        </tr>
      </thead>
      <tbody id="leadsBody"></tbody>
    </table>

    <div id="emptyState" class="empty-state" style="display:none;">
      <p>📭 No inquiries yet</p>
    </div>
  </div>
</section>

<script>
let allLeads = [];
let allRooms = [];

window.addEventListener('load', () => {
  const token = localStorage.getItem('adminToken');
  if (!token) return window.location.href = 'admin-login.html';

  loadLeads();
  loadRooms();
});

function refreshData() {
  loadLeads();
  loadRooms();
}

function logout() {
  localStorage.removeItem('adminToken');
  window.location.href = 'admin-login.html';
}

async function loadLeads() {
  const token = localStorage.getItem('adminToken');

  try {
    const res = await fetch('/api/lead', {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (res.status === 401) return logout();

    const result = await res.json();

    if (result.success) {
      allLeads = result.data;
      displayLeads(allLeads);
      updateStats();
    }
  } catch (err) {
    showError('Error loading inquiries');
  } finally {
    document.getElementById('loadingMessage').style.display = 'none';
  }
}

function displayLeads(leads) {
  const body = document.getElementById('leadsBody');
  const table = document.getElementById('leadsTable');
  const empty = document.getElementById('emptyState');

  if (!leads.length) {
    table.style.display = 'none';
    empty.style.display = 'block';
    return;
  }

  table.style.display = 'table';
  empty.style.display = 'none';

  body.innerHTML = leads.map(lead => {
    const date = new Date(lead.createdAt).toLocaleString();

    return `
      <tr>
        <td>${date}</td>
        <td><strong>${lead.name}</strong></td>
        <td>${lead.email}</td>
        <td>${lead.phone}</td>
        <td>${lead.roomType}</td>
        <td>${lead.preferredDate || '-'}</td>
        <td>${lead.preferredTime || '-'}</td>
      </tr>
    `;
  }).join('');
}

function updateStats() {
  document.getElementById('totalLeads').textContent = allLeads.length;

  const now = new Date();
  const monthLeads = allLeads.filter(lead => {
    const d = new Date(lead.createdAt);
    return d.getMonth() === now.getMonth() &&
           d.getFullYear() === now.getFullYear();
  });

  document.getElementById('monthLeads').textContent = monthLeads.length;

  if (!allLeads.length) {
    document.getElementById('popularUnit').textContent = '-';
    return;
  }

  const counts = {};
  allLeads.forEach(lead => {
    counts[lead.roomType] = (counts[lead.roomType] || 0) + 1;
  });

  const popular = Object.entries(counts)
    .sort((a, b) => b[1] - a[1])[0][0];

  document.getElementById('popularUnit').textContent = popular;
}

function filterTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const unit = document.getElementById('unitFilter').value;

  const filtered = allLeads.filter(lead => {
    const matchesSearch =
      lead.name.toLowerCase().includes(search) ||
      lead.email.toLowerCase().includes(search);

    const matchesUnit =
      !unit || lead.roomType.includes(unit);

    return matchesSearch && matchesUnit;
  });

  displayLeads(filtered);
}

async function exportCSV() {
  if (!allLeads.length) return alert('No data to export');

  const rows = [
    ['Date', 'Name', 'Email', 'Phone', 'Unit', 'Preferred Date', 'Preferred Time']
  ];

  allLeads.forEach(lead => {
    rows.push([
      new Date(lead.createdAt).toLocaleString(),
      lead.name,
      lead.email,
      lead.phone,
      lead.roomType,
      lead.preferredDate || '',
      lead.preferredTime || ''
    ]);
  });

  const csvContent = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = 'leads.csv';
  a.click();

  URL.revokeObjectURL(url);
}

async function loadRooms() {
  try {
    const res = await fetch('/api/rooms');
    const json = await res.json();

    if (json.success) {
      allRooms = json.data;
      displayRooms(allRooms);
    }
  } catch (err) {
    console.error(err);
  }
}

function displayRooms(rooms) {
  const container = document.getElementById('featured-rooms');

  container.innerHTML = rooms.map(room => {
    const soldOut = room.availableUnits <= 0;

    return `
      <div class="room-card">
        <h3>${room.name}</h3>
        <p>${room.description || ''}</p>
        <p><strong>Available:</strong> ${room.availableUnits} / ${room.totalUnits}</p>
        <span class="price">${room.price}</span>

        <div style="display:flex;gap:8px;margin-top:10px;">
          <input type="number" id="input-${room._id}" value="${room.availableUnits}" min="0" max="${room.totalUnits}">
          <button class="btn-secondary" onclick="updateAvailability('${room._id}')">Save</button>
          ${soldOut ? '<span class="status-new">Sold Out</span>' : ''}
        </div>

        <div style="display:flex;gap:8px;margin-top:10px;">
          <input type="text" id="price-${room._id}" value="${room.price}">
          <button class="btn-secondary" onclick="updatePrice('${room._id}')">Update Price</button>
        </div>
      </div>
    `;
  }).join('');
}

async function updateAvailability(roomId) {
  const token = localStorage.getItem('adminToken');
  const input = document.getElementById(`input-${roomId}`);
  const newVal = Number(input.value);

  try {
    const res = await fetch(`/api/rooms/${roomId}/availability`, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ availableUnits: newVal })
    });

    const json = await res.json();
    if (json.success) loadRooms();
    else alert('Update failed');

  } catch {
    alert('Network error');
  }
}

async function updatePrice(roomId) {
  const token = localStorage.getItem('adminToken');
  const input = document.getElementById(`price-${roomId}`);
  const newPrice = input.value;

  try {
    const res = await fetch(`/api/rooms/${roomId}/price`, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ price: newPrice })
    });

    const json = await res.json();
    if (json.success) loadRooms();
    else alert('Price update failed');

  } catch {
    alert('Network error');
  }
}

function showError(msg) {
  const err = document.getElementById('errorMessage');
  err.textContent = msg;
  err.style.display = 'block';
}
</script>
<script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login | Ennie Garden Estate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  
</head>
<body style="margin: 0; padding: 0;">

<div class="login-container">
  <div class="login-box">
    <h1>Admin Dashboard</h1>
    <p>Ennie Garden Estate</p>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="password">Admin Password</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Enter admin password" 
          required
          autocomplete="off"
        >
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        Sign In
      </button>

      <div class="loading" id="loadingSpinner">
        <div class="spinner"></div>
        
      </div>
    </form>
  </div>
</div>

<script>
async function handleLogin(e) {
  e.preventDefault();

  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMessage');

  errorMsg.style.display = 'none';

  try {
    const res = await fetch('http://localhost:3000/api/admin/login', {   // ← UPDATE PORT if needed
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });

    const result = await res.json();

    if (result.success) {
      localStorage.setItem('adminToken', result.token);
      window.location.href = 'admin.html';
    } else {
      errorMsg.textContent = result.error || 'Invalid password';
      errorMsg.style.display = 'block';
    }
  } catch (err) {
    errorMsg.textContent = 'Cannot connect to server';
    errorMsg.style.display = 'block';
  }
}
</script>
</body>
</html>
